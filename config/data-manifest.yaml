      series_id: FEDFUNDS
      source_agency: Board of Governors of the Federal Reserve System (US)
      release: H.15 Selected Interest Rates
      frequency: monthly
      seasonal_adjustment: not seasonally adjusted
      copyright_status: "Public Domain: Citation Requested"
      revision_policy: >-
        The checked-in snapshot is the stated 2021-01-08 vintage. Explicit
        refresh uses FRED's current graph CSV and resets vintage_date to the
        UTC retrieval date; it does not claim an ALFRED real-time vintage.
      target_key_prefix: policy_rate
      target_months:
        - "2020-01"
        - "2020-04"
        - "2020-12"
    snapshot_path: ../research/data/fred-fedfunds-2020.json
    required: true
