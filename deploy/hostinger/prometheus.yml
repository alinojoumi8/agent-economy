global:
  scrape_interval: 30s
rule_files:
  - /etc/prometheus/storage-alerts.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]
scrape_configs:
  - job_name: catalog-backup
    static_configs:
      - targets: [catalog-backup:9091]
  - job_name: alertmanager
    static_configs:
      - targets: [alertmanager:9093]
  - job_name: litestream
    static_configs:
      - targets: [litestream:9090]
  - job_name: agent-economy
    static_configs:
      - targets: [app:8000]
