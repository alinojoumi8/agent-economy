groups:
  - name: storage-recovery
    rules:
      - alert: LitestreamUnavailable
        expr: up{job="litestream"} == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: SQLite backup service is unavailable
      - alert: LitestreamSyncFailures
        expr: increase(litestream_sync_error_count[5m]) > 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: SQLite changes are failing to reach the backup pipeline
      - alert: LitestreamRemoteFailures
        expr: increase(litestream_replica_operation_errors_total[5m]) > 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: The remote backup destination is returning errors
      - alert: LitestreamDiskFull
        expr: litestream_disk_full == 1
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: Free disk space is preventing backup progress
      - alert: LitestreamCompactionFailure
        expr: increase(litestream_compaction_verify_error_count[5m]) > 0
        labels: {severity: critical}
        annotations:
          summary: Backup integrity verification failed
