[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "agent-economy-client"
version = "0.1.0"
description = "Thin REST client for the Agent Economy external-agent gateway"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_economy"]
