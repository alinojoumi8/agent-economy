# Active production profile: MiniMax M3 Token Plan only.
# Kimi is intentionally disabled. The mixed-provider profiles remain explicit
# opt-ins in production-k2.6.yaml and production-kimi-code.yaml.
extends: base.yaml

population:
  size: 87  # citizens + institutional staff/founders = approximately 100 agents

llm:
  # Safe for the Token Plan's documented 3-4 concurrent-agent entry tier.
  concurrency: 3
  provider_retries: 1
  providers:
    minimax:
      kind: openai_compat
      # Token Plan keys (sk-cp-*) use the standard international OpenAI-compatible URL.
      base_url: https://api.minimax.io/v1
      api_key_env: MINIMAX_API_KEY
      timeout_s: 180
      healthcheck_path: /models
      max_tokens_field: max_completion_tokens
      request_defaults:
        reasoning_split: true
        # M3 may spend most of a 700-token ceiling on reasoning and truncate
        # before emitting its JSON action envelope.
        max_completion_tokens: 4096
  default_route: {provider: minimax, model: MiniMax-M3}
  routes:
    citizen:        {provider: minimax, model: MiniMax-M3}
    founder:        {provider: minimax, model: MiniMax-M3}
    conversation:   {provider: minimax, model: MiniMax-M3}
    memory:         {provider: minimax, model: MiniMax-M3}
    central_banker: {provider: minimax, model: MiniMax-M3}
    credit_officer: {provider: minimax, model: MiniMax-M3}
    reporter:       {provider: minimax, model: MiniMax-M3}
    editor:         {provider: minimax, model: MiniMax-M3}
    vc_partner:     {provider: minimax, model: MiniMax-M3}
    oracle:         {provider: minimax, model: MiniMax-M3}
