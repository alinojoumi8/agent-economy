# Bounded live-provider acceptance profile for Agent Economy v2.
#
# MiniMax handles high-impact institutional and strategic decisions. The local
# Ollama model handles newsroom, conversation, memory, and ordinary citizen
# work. Live inference remains opt-in at the CLI and this profile is deliberately
# small enough to inspect before any 1,000-agent live run.
extends: v2.yaml

population:
  target_total: 30

banks:
  count: 3
  names: ["Northstar Bank", "Ironvale Industrial Bank", "Suncoast Exchange Bank"]

firms:
  count: 4
  listed: 1

# Keep the institutional feedback loop while reducing the live pilot's fixed
# officeholders from the flagship 12/6 legislature to a compact 4/2 fixture.
political_model:
  enabled: true
  house_seats: 4
  senate_seats: 2
  house_election_interval_ticks: 180
  executive_election_interval_ticks: 360
  lobbying_disclosure_delay_ticks: 5

living_world:
  enabled: true
  core_agents: 4
  promotion_interval_ticks: 30
  require_trade_contract: true
  fx_market_maker_inventory: 100000000
  regions:
    - key: northstar
      name: Northstar Federation
      currency: NSD
      population: 24
      specialization: [technology, services, finance]
      x: 0.25
      y: 0.35
      legal_ruleset: northstar-us-inspired-1.0
      rate_ppm: 1000000
    - key: ironvale
      name: Ironvale Union
      currency: IVC
      population: 3
      specialization: [manufacturing, energy]
      x: 0.72
      y: 0.28
      legal_ruleset: external-lite-1.0
      rate_ppm: 750000
    - key: suncoast
      name: Suncoast Republic
      currency: SCD
      population: 3
      specialization: [agriculture, logistics, tourism]
      x: 0.55
      y: 0.78
      legal_ruleset: external-lite-1.0
      rate_ppm: 1200000

# One desk keeps narrative generation live while bounding local-model latency.
outlets:
  - {id: 1, name: "The Ledger", slant: "pro-market-sensational"}

budget:
  cap_usd: 0.25
  oracle_reserve_usd: 0.05
  conversation_pairs: 1

llm:
  concurrency: 2
  provider_retries: 1
  rate_limit_backoff_s: [5, 15, 30]
  decision_max_tokens: 900
  providers:
    minimax:
      kind: openai_compat
      base_url: https://api.minimax.io/v1
      api_key_env: MINIMAX_API_KEY
      timeout_s: 180
      healthcheck_path: /models
      max_tokens_field: max_completion_tokens
      request_defaults:
        reasoning_split: true
        max_completion_tokens: 4096
    ollama:
      kind: openai_compat
      base_url: http://127.0.0.1:11434/v1
      api_key_env: OLLAMA_API_KEY
      timeout_s: 240
      healthcheck_path: /models
      request_defaults:
        stream: false
  default_route: {provider: ollama, model: "gemma4:12b"}
  routes:
    # High-impact roles and purposes use the faster hosted strategic model.
    central_banker:       {provider: minimax, model: MiniMax-M3}
    credit_officer:       {provider: minimax, model: MiniMax-M3}
    vc_partner:           {provider: minimax, model: MiniMax-M3}
    founder:              {provider: minimax, model: MiniMax-M3}
    lawyer:               {provider: minimax, model: MiniMax-M3}
    exchange:             {provider: minimax, model: MiniMax-M3}
    gov_official:         {provider: minimax, model: MiniMax-M3}
    legislator_house:     {provider: minimax, model: MiniMax-M3}
    legislator_senate:    {provider: minimax, model: MiniMax-M3}
    regulator:            {provider: minimax, model: MiniMax-M3}
    competition_regulator: {provider: minimax, model: MiniMax-M3}
    labor_regulator:      {provider: minimax, model: MiniMax-M3}
    executive:            {provider: minimax, model: MiniMax-M3}
    lobbyist:             {provider: minimax, model: MiniMax-M3}
    oracle:               {provider: minimax, model: MiniMax-M3}
    # Background generation stays local and free.
    reporter:             {provider: ollama, model: "gemma4:12b"}
    editor:               {provider: ollama, model: "gemma4:12b"}
    conversation:         {provider: ollama, model: "gemma4:12b"}
    memory:               {provider: ollama, model: "gemma4:12b"}
    newsroom:             {provider: ollama, model: "gemma4:12b"}
  pricing:
    MiniMax-M3: {in: 0.30, out: 1.20, cache: 0.06}
    "gemma4:12b": {in: 0.0, out: 0.0, cache: 0.0}

checkpoint_every: 1
speed_delay_s: 0.0
