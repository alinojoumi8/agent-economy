# Small, paid, bounded DeepSeek V4.1 Flash profile for the same acceptance
# mechanics as live-smoke.yaml. Every model-eligible call is fail-closed to the
# official DeepSeek endpoint and exact model identifier.
extends: live-smoke.yaml

llm:
  providers:
    deepseek:
      kind: openai_compat
      base_url: https://api.deepseek.com
      api_key_env: DEEPSEEK_API_KEY
      concurrency: 6
      prompt_cache_mode: provider_automatic
      timeout_s: 60
      healthcheck_path: /models
      max_tokens_field: max_tokens
      request_defaults:
        stream: false
        # Non-thinking mode avoids multi-turn reasoning-content replay while
        # preserving the JSON action contract used by the simulation.
        thinking: {type: disabled}
  route_contract: {provider: deepseek, model: deepseek-flash}
  default_route: {provider: deepseek, model: deepseek-flash}
  routes:
    citizen:        {provider: deepseek, model: deepseek-flash}
    founder:        {provider: deepseek, model: deepseek-flash}
    central_banker: {provider: deepseek, model: deepseek-flash}
    credit_officer: {provider: deepseek, model: deepseek-flash}
    reporter:       {provider: deepseek, model: deepseek-flash}
    editor:         {provider: deepseek, model: deepseek-flash}
    vc_partner:     {provider: deepseek, model: deepseek-flash}
    oracle:         {provider: deepseek, model: deepseek-flash}
  pricing:
    deepseek-flash: {in: 0.30, out: 1.20, cache: 0.006}
