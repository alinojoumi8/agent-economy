# Live PRD acceptance profile. Provider rate limits are the only throughput ceiling.
extends: ../production-oracle-archive.yaml

acceptance:
  min_ticks: 365
  min_agents: 95
  max_agents: 105
  max_spend_usd: null
  efficiency_target_usd: 200
  oracle_p90_ms: 60000
  oracle_min_latency_samples: 6
  oracle_latency_source: scheduled_e2e_v1
  oracle_campaign_id: production-oracle-calibration
  oracle_campaign_version: 1
  oracle_questions:
    - at_tick: 5
      campaign_key: bank_run_t005
      horizon_ticks: 30
      expected_rule: {type: bank_run, window: 5, deposit_drop: 0.30}
      question: What is the probability of a bank run within 30 ticks?
    - at_tick: 65
      campaign_key: bank_run_t065
      horizon_ticks: 30
      expected_rule: {type: bank_run, window: 5, deposit_drop: 0.30}
      question: What is the probability of a bank run within 30 ticks?
    - at_tick: 125
      campaign_key: bank_run_t125
      horizon_ticks: 30
      expected_rule: {type: bank_run, window: 5, deposit_drop: 0.30}
      question: What is the probability of a bank run within 30 ticks?
    - at_tick: 185
      campaign_key: bank_run_t185
      horizon_ticks: 30
      expected_rule: {type: bank_run, window: 5, deposit_drop: 0.30}
      question: What is the probability of a bank run within 30 ticks?
    - at_tick: 245
      campaign_key: bank_run_t245
      horizon_ticks: 30
      expected_rule: {type: bank_run, window: 5, deposit_drop: 0.30}
      question: What is the probability of a bank run within 30 ticks?
    - at_tick: 305
      campaign_key: bank_run_t305
      horizon_ticks: 30
      expected_rule: {type: bank_run, window: 5, deposit_drop: 0.30}
      question: What is the probability of a bank run within 30 ticks?

shocks:
  - kind: rumor
    trigger: shock
    trigger_params: {tick: 15}
    params:
      bank_selector: largest_by_deposits
      audience: current_depositors
      n_agents: 40
    label: acceptance-bank-rumor
  - kind: policy_rate
    trigger: shock
    trigger_params: {tick: 40}
    params: {rate_bps: 875}
    label: acceptance-policy-rate
  - kind: oil
    trigger: trend
    trigger_params: {start: 70}
    duration_ticks: 10
    params: {multiplier: 1.8}
    label: acceptance-oil
  - kind: slant
    trigger: shock
    trigger_params: {tick: 110}
    duration_ticks: 5
    params: {outlet_id: 1, directive: Frame the downturn as an urgent market crisis.}
    label: acceptance-slant
  - kind: scandal
    trigger: shock
    trigger_params: {tick: 150}
    params: {firm_id: 1, description: Accounting controls are under investigation.}
    label: acceptance-scandal
