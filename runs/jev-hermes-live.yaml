# Same Hermes world and background providers; Jev selects bounded routine turns.
extends: jev-hermes-baseline.yaml
llm:
  providers:
    openrouter_jev:
      kind: openrouter_decisions
      endpoint: https://openrouter.ai/api/alpha/decisions
      api_key_env: OPENROUTER_API_KEY
      timeout_s: 20
      concurrency: 3
      resolved_models: [typesafe/jev-1.13, typesafe/jev-1.13-20260917]
      upstream_provider: TypeSafe
  pricing:
    typesafe/jev-1.13: {in: 0.042, out: 0.0, cache: 0.042}
  decision_policy:
    version: bounded-economic-choice-v1
    primary: {provider: openrouter_jev, model: typesafe/jev-1.13, timeout_s: 20}
    population_fraction: 1.0
    eligible_tiers: [legacy, local, flash, premium]
    minimum_confidence: 0.0
    on_abstain: wait
    activation_tick: 1
    max_goods_offers: 4
    max_job_options: 3
    max_quantity: 8
    spending_bps: 2000
    max_output_tokens: 2048
