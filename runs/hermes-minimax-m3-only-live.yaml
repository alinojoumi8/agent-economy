# Local 60-day live rehearsal using MiniMax M3 exclusively.
# No CLI, scripted, mock, or fallback provider is configured or routed.
# Launch with:
#   python run.py --config runs/hermes-minimax-m3-only-live.yaml --ticks 60 \
#     --serve --preflight-live --approve-live-inference \
#     --host 127.0.0.1 --port 8000
extends: hermes-local.yaml

communications:
  autonomous_scripted_enabled: false

conversations:
  turns: 1

budget:
  cap_usd: 25.0
  oracle_reserve_usd: 0.50
  report_reserve_usd: 0.25
  conversation_pairs: 1

llm:
  live_only: true
  require_preflight_live: true
  institutional_role_purposes: true
  max_in_flight: 2
  concurrency: 2
  logical_deadline_s: 600
  provider_retries: 1
  decision_max_tokens: 900

  providers:
    minimax:
      kind: openai_compat
      base_url: https://api.minimax.io/v1
      api_key_env: MINIMAX_API_KEY
      concurrency: 2
      prompt_cache_mode: provider_automatic
      timeout_s: 240
      healthcheck_path: /models
      max_tokens_field: max_completion_tokens
      request_defaults:
        reasoning_split: true
        max_completion_tokens: 16384

  default_route: {provider: minimax, model: MiniMax-M3}
  routes: {}
  citizen_model_cohorts:
    - name: minimax-m3-only
      count: 8
      primary: {provider: minimax, model: MiniMax-M3, timeout_s: 240}

  pricing:
    MiniMax-M3: {in: 0.30, out: 1.20, cache: 0.06}

checkpoint_every: 5
speed_delay_s: 0.0

resource_guard:
  enabled: true
  sample_interval_s: 2
  max_cpu_percent: 90
  max_memory_percent: 75
  min_available_memory_gb: 8
  max_swap_percent: 60
  consecutive_breaches: 2
