# Locked PRD acceptance profile: MiniMax M3 Token Plan + Kimi K2.6 API Platform.
# This profile is opt-in while Kimi is disabled from the active production runtime.
extends: base.yaml

population:
  size: 87  # citizens + institutional staff/founders = approximately 100 agents

llm:
  concurrency: 3
  provider_retries: 1
  providers:
    minimax:
      kind: openai_compat
      base_url: https://api.minimax.io/v1
      api_key_env: MINIMAX_API_KEY
      timeout_s: 180
      healthcheck_path: /models
      max_tokens_field: max_completion_tokens
      request_defaults:
        reasoning_split: true
        max_completion_tokens: 4096
    kimi:
      kind: openai_compat
      base_url: https://api.moonshot.ai/v1
      api_key_env: KIMI_API_KEY
      timeout_s: 180
      healthcheck_path: /models
      max_tokens_field: max_tokens
      request_defaults:
        thinking: {type: enabled}
        temperature: 1.0
        max_tokens: 4096
  default_route: {provider: minimax, model: MiniMax-M3}
  routes:
    citizen:        {provider: minimax, model: MiniMax-M3}
    founder:        {provider: minimax, model: MiniMax-M3}
    central_banker: {provider: kimi, model: kimi-k2.6}
    credit_officer: {provider: kimi, model: kimi-k2.6}
    reporter:       {provider: kimi, model: kimi-k2.6}
    editor:         {provider: kimi, model: kimi-k2.6}
    vc_partner:     {provider: kimi, model: kimi-k2.6}
    oracle:         {provider: kimi, model: kimi-k2.6}
