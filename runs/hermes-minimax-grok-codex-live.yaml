# Local 60-day live rehearsal: eight native citizens are split deterministically
# across MiniMax M3, isolated Grok CLI, and isolated Codex CLI workers.
# Launch with:
#   python run.py --config runs/hermes-minimax-grok-codex-live.yaml --ticks 60 \
#     --serve --preflight-live --approve-live-inference \
#     --host 127.0.0.1 --port 8000
extends: hermes-grok-codex-live.yaml

budget:
  cap_usd: 25.0
  oracle_reserve_usd: 0.50
  report_reserve_usd: 0.25
  conversation_pairs: 1

llm:
  max_in_flight: 4
  concurrency: 4
  provider_retries: 1

  providers:
    minimax:
      kind: openai_compat
      base_url: https://api.minimax.io/v1
      api_key_env: MINIMAX_API_KEY
      concurrency: 2
      prompt_cache_mode: provider_automatic
      timeout_s: 240
      healthcheck_path: /models
      max_tokens_field: max_completion_tokens
      request_defaults:
        reasoning_split: true
        max_completion_tokens: 16384

  default_route: {provider: minimax, model: MiniMax-M3}
  citizen_model_cohorts:
    - name: minimax-m3
      count: 3
      primary: {provider: minimax, model: MiniMax-M3, timeout_s: 150}
      fallback: {provider: grok_cli, model: grok-4.5, timeout_s: 90}
    - name: grok-4.5-low
      count: 3
      primary: {provider: grok_cli, model: grok-4.5, timeout_s: 90}
      fallback: {provider: codex_cli, model: gpt-5.6-luna, timeout_s: 90}
    - name: codex-luna-5.6-low
      count: 2
      primary: {provider: codex_cli, model: gpt-5.6-luna, timeout_s: 90}
      fallback: {provider: minimax, model: MiniMax-M3, timeout_s: 150}

  pricing:
    MiniMax-M3: {in: 0.30, out: 1.20, cache: 0.06}

checkpoint_every: 5
speed_delay_s: 0.0
