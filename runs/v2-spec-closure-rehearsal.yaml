# Free, deterministic five-tick Semantics-7 specification-closure rehearsal.
# The fixture prepares action-ready state; all decisions and persona enrichment
# use recorded scripted policies, so this profile never opens a network socket.
extends: v2.yaml

seed: 707
engine_semantics_version: 7
ticks: 5
dataset_manifest: null

population:
  target_total: 42

banks:
  count: 3
  names: ["Northstar Bank", "Ironvale Industrial Bank", "Suncoast Exchange Bank"]

firms:
  count: 3
  listed: 0
  target_headcount: 1

# Keep the political/legal feedback loop, but use the same compact legislature
# as the bounded v2 pilots.
political_model:
  enabled: true
  actor_bound_authorization: true
  house_seats: 4
  senate_seats: 2
  house_election_interval_ticks: 180
  executive_election_interval_ticks: 360
  lobbying_disclosure_delay_ticks: 5

# Health institutions are unrelated to this closure gate and would add two
# founders plus background payroll state.
health: null

lifecycle:
  retirement_age: 65
  medical_cost_cents: 5000
  housing_cost_cents: 75000
  population_mode: stable
  retirement_liquidity_target_cents: 150000
  retired_act_every: 1
  retired_portfolio_every: 2
  retired_news_every: 1

living_world:
  enabled: true
  core_agents: 4
  promotion_interval_ticks: 30
  require_trade_contract: true
  fx_market_maker_inventory: 100000000
  migration_wage_gain_bps: 1000
  max_trade_opportunities: 5
  max_trade_quantity: 3
  trade_transit_ticks: 2
  regions:
    - key: northstar
      name: Northstar Federation
      currency: NSD
      population: 30
      specialization: [technology, services, finance]
      x: 0.25
      y: 0.35
      legal_ruleset: northstar-us-inspired-1.0
      rate_ppm: 1000000
    - key: ironvale
      name: Ironvale Union
      currency: IVC
      population: 6
      specialization: [manufacturing, energy]
      x: 0.72
      y: 0.28
      legal_ruleset: external-lite-1.0
      rate_ppm: 750000
    - key: suncoast
      name: Suncoast Republic
      currency: SCD
      population: 6
      specialization: [agriculture, logistics, tourism]
      x: 0.55
      y: 0.78
      legal_ruleset: external-lite-1.0
      rate_ppm: 1200000

spec_closure_fixture:
  enabled: true
  key: semantics-7-spec-closure-v1
  origin_region: northstar
  arrival_due_tick: 1
  retiree_checking_cents: 20000
  retiree_savings_cents: 300000
  loan_amount_cents: 120000
  loan_rate_bps: 900
  loan_term_ticks: 12
  collateral_recovery_cents: 5000
  exporter_inventory: 8
  importer_funds_cents: 500000
  # One three-unit invoice uses most importer liquidity. That leaves exactly
  # one bounded opportunity, and the high unit price keeps household shopping
  # from racing the shipment for fixture inventory.
  trade_unit_price_cents: 100000
  migration_destination_wage_cents: 10000000

budget:
  cap_usd: 0.0
  oracle_reserve_usd: 0.0
  report_reserve_usd: 0.0
  conversation_pairs: 1

llm:
  concurrency: 4
  institutional_role_purposes: true
  local_currency_action_surfaces: true
  default_route: {provider: scripted, model: scripted}
  routes: {}

checkpoint_every: 1
speed_delay_s: 0.0
