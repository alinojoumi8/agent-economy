key: 2020-pandemic
version: "1.0"
title: 2020 pandemic policy alternatives
ticks: 365
base_config: ../runs/v2.yaml
dataset_manifest: ../config/data-manifest.yaml
limitations: Directional stylized-fact exercise only. It is not a forecast, historical reconstruction, or estimate of real policy effects.
overrides:
  seed: 2020
  population:
    target_total: 1000
common_shocks:
  - kind: epidemic
    trigger: shock
    trigger_params: {tick: 60}
    duration_ticks: 150
    params: {multiplier: 12.0}
    label: pandemic labor and health shock
  - kind: oil
    trigger: shock
    trigger_params: {tick: 65}
    params: {multiplier: 1.35}
    label: supply-chain input shock
arms:
  no_additional_relief:
    treatment_variables: {relief: none}
    shocks: []
  targeted_relief:
    treatment_variables: {relief: targeted, unemployment_benefit_cents: 240000}
    shocks:
      - kind: policy_rule_change
        trigger: shock
        trigger_params: {tick: 70}
        params:
          changes: {unemployment_benefit_cents: 240000}
        label: targeted household relief
  broad_relief:
    treatment_variables: {relief: broad, unemployment_benefit_cents: 360000, tax_rate_bps: 900}
    shocks:
      - kind: policy_rule_change
        trigger: shock
        trigger_params: {tick: 70}
        params:
          changes: {unemployment_benefit_cents: 360000, tax_rate_bps: 900}
        label: broad household relief
metrics: [unemployment, inflation_30d, gini, firm_entries, firm_exits, gdp_proxy_30d, litigation_burden, hhi]
